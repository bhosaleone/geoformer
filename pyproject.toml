[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geoformer-sdk"
version = "0.1.0"
description = "Quantized Propagation Geometry & Neuromorphic GeoFormer Framework"
readme = "README.md"
authors = [
    { name = "Atmabhan Pandit (Shrikant Bhosale)", email = "research@twistpool.org" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
    "z3-solver>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
